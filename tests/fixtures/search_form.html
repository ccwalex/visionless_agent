<!DOCTYPE html>
<html>
<head><title>Library search</title></head>
<body>
  <form id="search" action="/search" method="get">
    <label for="q">Query</label>
    <input id="q" name="q" type="search" placeholder="Search the catalog">
    <button type="submit" name="go">Search</button>
  </form>
  <form id="filters" action="/search" method="get">
    <label for="sort">Sort</label>
    <select id="sort" name="sort">
      <option>relevance</option>
      <option>newest</option>
    </select>
    <input type="hidden" name="src" value="ui">
    <button type="submit">Apply filters</button>
  </form>
  <button id="export" type="button">Export CSV</button>
  <a href="/advanced">Advanced search</a>
</body>
</html>
